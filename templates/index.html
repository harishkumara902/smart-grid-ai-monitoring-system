<!DOCTYPE html>
<html>

<head>
    <title>Smart Grid AI Dashboard</title>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">

    <style>

        :root {
            --cream:   #FFFAF0;
            --red:     #E03F4F;
            --olive:   #81912F;
            --yellow:  #F8C463;
            --dark:    #111208;
            --card-bg: #1a1c0f;
            --border:  rgba(248,196,99,0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--dark);
            color: var(--cream);
            font-family: 'Syne', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            opacity: 0.05;
            pointer-events: none;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 28px 40px;
            border-bottom: 1px solid var(--border);
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
            background: var(--yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        header h1 {
            font-size: 24px;
            font-weight: 800;
        }

        header h1 span {
            color: var(--yellow);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background: var(--olive);
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.2;
            }
        }

        main {
            padding: 28px 40px;
        }

        #alertBox {
            display: none;
            background: rgba(224,63,79,0.12);
            border: 1px solid var(--red);
            color: var(--red);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .card-label {
            font-size: 11px;
            color: rgba(255,250,240,0.4);
            margin-bottom: 10px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .card-value {
            font-size: 34px;
            font-weight: 800;
        }

        .card-unit {
            font-size: 11px;
            color: rgba(255,250,240,0.3);
            margin-top: 5px;
        }

        .charts {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .chart-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            height: 360px;
        }

        .chart-title {
            font-size: 11px;
            margin-bottom: 12px;
            letter-spacing: 1px;
            color: rgba(255,250,240,0.45);
            text-transform: uppercase;
        }

        canvas {
            width: 100% !important;
            height: 280px !important;
        }

        footer {
            padding: 20px 40px;
            font-size: 11px;
            color: rgba(255,250,240,0.25);
        }

    </style>

</head>

<body>

<header>

    <div class="logo-group">

        <div class="logo-icon">⚡</div>

        <div>
            <h1>Smart<span>Grid</span> AI</h1>
        </div>

    </div>

    <div>
        <span class="live-dot"></span>
        LIVE SYSTEM
    </div>

</header>

<main>

<div id="alertBox">
    ⚠ ANOMALY DETECTED
</div>

<div class="cards">

    <div class="card">
        <div class="card-label">Actual Load</div>
        <div class="card-value" id="actualValue">0</div>
        <div class="card-unit">MW</div>
    </div>

    <div class="card">
        <div class="card-label">Predicted Load</div>
        <div class="card-value" id="predictedValue">0</div>
        <div class="card-unit">MW</div>
    </div>

    <div class="card">
        <div class="card-label">Voltage</div>
        <div class="card-value" id="voltageValue">0</div>
        <div class="card-unit">V</div>
    </div>

    <div class="card">
        <div class="card-label">Frequency</div>
        <div class="card-value" id="frequencyValue">0</div>
        <div class="card-unit">Hz</div>
    </div>

    <div class="card">
        <div class="card-label">Average Load</div>
        <div class="card-value" id="averageLoad">0</div>
        <div class="card-unit">MW</div>
    </div>

    <div class="card">
        <div class="card-label">Peak Load</div>
        <div class="card-value" id="peakLoad">0</div>
        <div class="card-unit">MW</div>
    </div>

    <div class="card">
        <div class="card-label">Min Load</div>
        <div class="card-value" id="minLoad">0</div>
        <div class="card-unit">MW</div>
    </div>

    <div class="card">
        <div class="card-label">Accuracy</div>
        <div class="card-value" id="accuracyValue">0</div>
        <div class="card-unit">%</div>
    </div>

</div>

<div class="charts">

    <div class="chart-box">
        <div class="chart-title">Actual vs Predicted Load</div>
        <canvas id="loadChart"></canvas>
    </div>

    <div class="chart-box">
        <div class="chart-title">Voltage Monitor</div>
        <canvas id="voltageChart"></canvas>
    </div>

    <div class="chart-box">
        <div class="chart-title">Frequency Monitor</div>
        <canvas id="frequencyChart"></canvas>
    </div>

    <div class="chart-box">
        <div class="chart-title">Anomaly Score</div>
        <canvas id="anomalyChart"></canvas>
    </div>

    <div class="chart-box">
        <div class="chart-title">Future Forecast</div>
        <canvas id="forecastChart"></canvas>
    </div>

</div>

</main>

<footer>
    SMARTGRID AI MONITORING PLATFORM
</footer>

<script>

Chart.defaults.color = 'rgba(255,250,240,0.4)';
Chart.defaults.borderColor = 'rgba(255,250,240,0.08)';

const socket = io();

const labels = [];

const actualData = [];
const predictedData = [];
const voltageData = [];
const frequencyData = [];
const anomalyData = [];
const forecastData = [];

function makeChart(id, data, color){

    return new Chart(document.getElementById(id), {

        type: 'line',

        data: {

            labels: labels,

            datasets: [{

                data: data,
                borderColor: color,
                borderWidth: 2,
                pointRadius: 0,
                tension: 0.4,
                fill: false
            }]
        },

        options: {

            responsive: true,
            maintainAspectRatio: false,
            animation: false
        }
    });
}

const loadChart = new Chart(
document.getElementById('loadChart'),
{
type:'line',

data:{
labels:labels,

datasets:[
{
label:'Actual',
data:actualData,
borderColor:'#22d3ee',
borderWidth:2,
pointRadius:0,
tension:0.4
},
{
label:'Predicted',
data:predictedData,
borderColor:'#F8C463',
borderWidth:2,
pointRadius:0,
borderDash:[5,5],
tension:0.4
}
]
},

options:{
responsive:true,
maintainAspectRatio:false,
animation:false
}
});

const voltageChart =
makeChart(
'voltageChart',
voltageData,
'#81912F'
);

const frequencyChart =
makeChart(
'frequencyChart',
frequencyData,
'#E03F4F'
);

const anomalyChart =
makeChart(
'anomalyChart',
anomalyData,
'#ff4d4d'
);

const forecastChart =
makeChart(
'forecastChart',
forecastData,
'#ff00ff'
);

socket.on('new_data', function(data){

    labels.push('');

    actualData.push(data.actual);

    predictedData.push(data.predicted);

    voltageData.push(data.voltage);

    frequencyData.push(data.frequency);

    anomalyData.push(data.anomaly);

    forecastChart.data.datasets[0].data =
        data.future_predictions;

    document.getElementById(
        'actualValue'
    ).innerText =
        data.actual.toFixed(2);

    document.getElementById(
        'predictedValue'
    ).innerText =
        data.predicted.toFixed(2);

    document.getElementById(
        'voltageValue'
    ).innerText =
        data.voltage.toFixed(2);

    document.getElementById(
        'frequencyValue'
    ).innerText =
        data.frequency.toFixed(2);

    document.getElementById(
        'averageLoad'
    ).innerText =
        data.average_load.toFixed(2);

    document.getElementById(
        'peakLoad'
    ).innerText =
        data.peak_load.toFixed(2);

    document.getElementById(
        'minLoad'
    ).innerText =
        data.min_load.toFixed(2);

    document.getElementById(
        'accuracyValue'
    ).innerText =
        data.accuracy.toFixed(2);

    if(labels.length > 50){

        labels.shift();

        actualData.shift();

        predictedData.shift();

        voltageData.shift();

        frequencyData.shift();

        anomalyData.shift();
    }

    if(data.anomaly > 10){

        document.getElementById(
            'alertBox'
        ).style.display = 'block';

    }else{

        document.getElementById(
            'alertBox'
        ).style.display = 'none';
    }

    loadChart.update();

    voltageChart.update();

    frequencyChart.update();

    anomalyChart.update();

    forecastChart.update();

});

</script>

</body>

</html>
